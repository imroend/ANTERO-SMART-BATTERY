<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Battery Analyzer - Dashboard Global</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00adb5; margin-bottom: 30px; font-size: 24px; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; padding: 20px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h2 { color: #00adb5; margin-top: 0; border-bottom: 2px solid #2d2d2d; padding-bottom: 5px; font-size: 20px; text-align: center; }
        .data-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; }
        .label { color: #a0a0a0; }
        .value { font-weight: bold; color: #ffffff; }
        .status-val { font-weight: bold; color: #ff9f43; text-transform: uppercase; }
    </style>
</head>
<body>

    <h1>SMART BATTERY ANALYZER DASHBOARD GLOBAL</h1>
    
    <div class="grid-container" id="dashboard-grid">
        <!-- Slot 1 sampai 6 akan dibuat otomatis oleh JavaScript di bawah -->
    </div>

    <!-- Hubungkan ke Firebase App & Realtime Database via CDN -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, onValue } from "https://gstatic.com";

        // 1. Konfigurasi Web Firebase Anda (Ganti apiKey dengan Web API Key Anda seperlunya)
        const firebaseConfig = {
            apiKey: "AIzaSyAR5OzScCw3TcQLmK0fAi5qO2UITlCtW3A",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "antero-smart-battery-eb4fd",
            storageBucket: "://appspot.com",
        };

        // 2. Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 3. Gambar Kerangka Visual 6 Slot di HTML secara otomatis
        const grid = document.getElementById("dashboard-grid");
        for (let i = 1; i <= 6; i++) {
            grid.innerHTML += `
                <div class="card">
                    <h2>SLOT ${i}</h2>
                    <div class="data-row"><span class="label">Tegangan:</span><span class="value" id="volt-${i}">0.00 V</span></div>
                    <div class="data-row"><span class="label">Kapasitas:</span><span class="value" id="mah-${i}">0 mAh</span></div>
                    <div class="data-row"><span class="label">Hambatan Dalam:</span><span class="value" id="ir-${i}">0 mOhm</span></div>
                    <div class="data-row"><span class="label">Status Alat:</span><span class="status-val" id="status-${i}">KOSONG</span></div>
                </div>
            `;
        }

        // 4. MENGAKTIFKAN LISTENER ONLINE (Data otomatis berubah tanpa reload page!)
        const dbRef = ref(db, '/');
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            for (let i = 1; i <= 6; i++) {
                const slotKey = `slot${i}`;
                if (data[slotKey]) {
                    const slotData = data[slotKey];
                    if (slotData.volt !== undefined) document.getElementById(`volt-${i}`).innerText = parseFloat(slotData.volt).toFixed(2) + " V";
                    if (slotData.mah !== undefined) document.getElementById(`mah-${i}`).innerText = slotData.mah + " mAh";
                    if (slotData.ir !== undefined) document.getElementById(`ir-${i}`).innerText = slotData.ir + " mOhm";
                    if (slotData.status !== undefined) document.getElementById(`status-${i}`).innerText = slotData.status;
                }
            }
        });
    </script>
</body>
</html>
