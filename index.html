<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Battery Analyzer - Dashboard Global</title>
    <!-- Library Firebase v8 Resmi -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #00adb5; margin-bottom: 30px; font-weight: 600; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #2d2d2d;
        }
        .card h3 { color: #00adb5; margin-top: 0; border-bottom: 2px solid #2d2d2d; padding-bottom: 8px; }
        .data-line { display: flex; justify-content: space-between; margin: 12px 0; font-size: 15px; }
        .value { font-weight: bold; color: #ffffff; }
        .status-val { color: #ff9f43; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; margin-top: 18px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            background-color: #00adb5;
            color: white;
        }
        .btn-charge { background-color: #28c76f; color: white; }
        .btn-test { background-color: #00adb5; color: white; }
    </style>
</head>
<body>

    <h1>SMART BATTERY ANALYZER DASHBOARD</h1>
    
    <div class="grid">
        <!-- Struktur Loop Otomatis Generate 6 Slot agar HTML Bersih -->
        <script>
            for (let i = 1; i <= 6; i++) {
                document.write(`
                    <div class="card">
                        <h3>SLOT ${i}</h3>
                        <div class="data-line"><span>Tegangan:</span> <span class="value" id="volt-${i}">0.00 V</span></div>
                        <div class="data-line"><span>Kapasitas:</span> <span class="value" id="mah-${i}">0 mAh</span></div>
                        <div class="data-line"><span>Hambatan Dalam:</span> <span class="value" id="ir-${i}">0 mOhm</span></div>
                        <div class="data-line"><span>Status Alat:</span> <span class="status-val" id="status-${i}">MEMBACA...</span></div>
                        <div class="btn-group">
                            <button class="btn-charge" onclick="kirimPerintah('c${i}')">CHARGE</button>
                            <button class="btn-test" onclick="kirimPerintah('t${i}')">SMART TEST</button>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>

    <script>
        // Konfigurasi Database Regional Asia Tenggara Anda
        const firebaseConfig = {
          apiKey: "AIzaSyAR5OzScCw3TcQLmK0fAi5qO2UITlCtW3A",
          authDomain: "://firebaseapp.com",
          databaseURL: "https://firebasedatabase.app",
          projectId: "antero-smart-battery-eb4fd",
          storageBucket: "antero-smart-battery-eb4fd.firebasestorage.app",
          messagingSenderId: "248367305274",
          appId: "1:248367305274:web:c9c72c44d6245d216fdb03"
        };
        
        // Inisialisasi Layanan Jaringan Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Menerima data sensor secara Real-Time dari Firebase ke Browser Web
        database.ref('/').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            for (let i = 1; i <= 6; i++) {
                const slotData = data['slot' + i];
                if (slotData) {
                    if (slotData.volt !== undefined) document.getElementById(`volt-${i}`).innerText = Number(slotData.volt).toFixed(2) + " V";
                    if (slotData.mah !== undefined) document.getElementById(`mah-${i}`).innerText = slotData.mah + " mAh";
                    if (slotData.ir !== undefined) document.getElementById(`ir-${i}`).innerText = slotData.ir + " mOhm";
                    if (slotData.status !== undefined) document.getElementById(`status-${i}`).innerText = slotData.status;
                }
            }
        });

        // Mengirimkan instruksi balik (Kontrol Jarak Jauh 2-Arah)
        function kirimPerintah(kodePerintah) {
            database.ref('/kontrol').set(kodePerintah)
                .then(() => alert("Perintah " + kodePerintah.toUpperCase() + " Sukses Terkirim!"))
                .catch((error) => alert("Gagal: " + error.message));
        }
    </script>
</body>
</html>
